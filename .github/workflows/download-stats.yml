# Records the running download total of every release asset, so the dashboard can chart downloads over time.
name: Download stats
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=stats/downloads.csv
          mkdir -p stats
          [ -f "$f" ] || echo "time,release,asset,downloads" > "$f"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq ".[] | .tag_name as \$t | .assets[] | [\"$now\", \$t, .name, .download_count] | @csv" | tr -d '"' >> "$f"
      - name: Commit
        run: |
          git config user.name "tapformat-stats"
          git config user.email "actions@users.noreply.github.com"
          git add stats/downloads.csv
          git diff --cached --quiet || (git commit -m "Download stats snapshot" && git push)
